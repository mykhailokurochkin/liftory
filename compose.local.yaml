services:
  db:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: '2' }

volumes:
  database:
    name: ${LIFTORY_LOCAL_DATABASE_VOLUME:-personal-liftory-local_database}
    external: ${LIFTORY_LOCAL_DATABASE_EXTERNAL:-false}
